[package]
name = "sycamorefmt"
version = "0.1.0"
edition = "2021"
description = "A code formatter for Sycamore's `view! { ... }` macro syntax, built on top of rustfmt."
license = "MIT"

[[bin]]
name = "sycamorefmt"
path = "src/main.rs"

[lib]
name = "sycamorefmt"
path = "src/lib.rs"

[dependencies]
# Local path dependency on the Sycamore view! macro parser, so that we parse
# exactly the same grammar that `sycamore-macro` uses at compile time.
sycamore-view-parser = { path = "../sycamore/packages/sycamore-view-parser" }

proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.21"
syn = { version = "2.0.10", features = ["extra-traits", "full", "visit", "parsing", "printing"] }

[dev-dependencies]
